<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect width="1180" height="900" fill="#0f172a"/>
<text x="24" y="30" font-size="17" font-weight="bold" fill="#e2e8f0">自瞄原理：延迟计算 → 整车预测 → 飞行时间迭代 → 开火与下发</text>
<text x="24" y="50" font-size="11.5" fill="#94a3b8">165 Hz 哨兵链路（sentry/config/sentry_165hz.yaml）。所有时间都以曝光中心时刻 t_exp 为原点；上车时前两段每帧实测，后两段用配置值。</text>
<text x="24.0" y="84.0" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="bold">① 时间轴：一帧画面从曝光到命中</text>
<rect x="60" y="150" width="147" height="34" rx="4" fill="#3b82f6" opacity="0.88"/>
<text x="135.0" y="172.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">传输 10 ms</text>
<text x="135.0" y="202.0" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal">6–14 ms</text>
<text x="135.0" y="218.0" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="normal">曝光 2.5 ms + 读出 + USB 4.4 ms</text>
<rect x="210" y="150" width="117" height="34" rx="4" fill="#14b8a6" opacity="0.88"/>
<text x="270.0" y="172.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">处理 5 ms</text>
<text x="270.0" y="202.0" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal">每帧实测</text>
<text x="270.0" y="218.0" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="normal">检测/PnP/EKF/瞄准</text>
<rect x="330" y="150" width="167" height="34" rx="4" fill="#f59e0b" opacity="0.88"/>
<text x="415.0" y="172.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">串口+MCU 20 ms</text>
<text x="415.0" y="202.0" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal">10–30 ms</text>
<text x="415.0" y="218.0" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="normal">21 B 帧 + MCU 控制周期</text>
<rect x="500" y="150" width="187" height="34" rx="4" fill="#ef4444" opacity="0.88"/>
<text x="595.0" y="172.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">发射 30 ms</text>
<text x="595.0" y="202.0" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal">30 ms</text>
<text x="595.0" y="218.0" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="normal">开火 → 出膛（拨弹/摩擦轮）</text>
<rect x="690" y="150" width="327" height="34" rx="4" fill="#a78bfa" opacity="0.88"/>
<text x="855.0" y="172.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold">弹丸飞行 210 ms</text>
<text x="855.0" y="202.0" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal">3 m 124 / 5 m 210 / 7 m 300 ms</text>
<text x="855.0" y="218.0" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="normal">RK4 + 二次阻力，逐帧解算</text>
<line x1="60" y1="128" x2="60" y2="190" stroke="#94a3b8" stroke-width="1"/>
<text x="60.0" y="116.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold">t_exp</text>
<text x="60.0" y="128.0" font-size="1" fill="#e2e8f0" text-anchor="start" font-weight="normal"></text>
<text x="64.0" y="142.0" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal">曝光中心戳</text>
<line x1="210" y1="128" x2="210" y2="190" stroke="#94a3b8" stroke-width="1"/>
<text x="210.0" y="116.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold">t_host</text>
<text x="210.0" y="128.0" font-size="1" fill="#e2e8f0" text-anchor="start" font-weight="normal"></text>
<text x="214.0" y="142.0" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal">帧到内存</text>
<line x1="330" y1="128" x2="330" y2="190" stroke="#94a3b8" stroke-width="1"/>
<text x="330.0" y="116.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold">t_cmd = now</text>
<text x="330.0" y="128.0" font-size="1" fill="#e2e8f0" text-anchor="start" font-weight="normal"></text>
<text x="334.0" y="142.0" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal">指令发出</text>
<line x1="500" y1="128" x2="500" y2="190" stroke="#94a3b8" stroke-width="1"/>
<text x="500.0" y="116.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold">t_mcu</text>
<text x="500.0" y="128.0" font-size="1" fill="#e2e8f0" text-anchor="start" font-weight="normal"></text>
<text x="504.0" y="142.0" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal">云台执行</text>
<line x1="690" y1="128" x2="690" y2="190" stroke="#94a3b8" stroke-width="1"/>
<text x="690.0" y="116.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold">t_muzzle</text>
<text x="690.0" y="128.0" font-size="1" fill="#e2e8f0" text-anchor="start" font-weight="normal"></text>
<text x="694.0" y="142.0" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal">出膛</text>
<line x1="1020" y1="128" x2="1020" y2="190" stroke="#94a3b8" stroke-width="1"/>
<text x="1020.0" y="116.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold">t_impact</text>
<text x="1020.0" y="128.0" font-size="1" fill="#e2e8f0" text-anchor="start" font-weight="normal"></text>
<text x="1024.0" y="142.0" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal">命中</text>
<path d="M60,236 L60,242 L330,242 L330,236" fill="none" stroke="#14b8a6" stroke-width="1.6"/>
<text x="64.0" y="258.0" font-size="11.5" fill="#14b8a6" text-anchor="start" font-weight="normal">elapsed = now − t_exp（上车每帧实测；离线用 transfer_delay + process_delay）</text>
<path d="M330,272 L330,278 L690,278 L690,272" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
<text x="334.0" y="294.0" font-size="11.5" fill="#f59e0b" text-anchor="start" font-weight="normal">comm_delay + fire_delay（配置值，暂无逐帧测量手段）</text>
<path d="M60,308 L60,314 L690,314 L690,308" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="64.0" y="330.0" font-size="11.5" fill="#e2e8f0" text-anchor="start" font-weight="normal">出膛前延迟 L = latency + elapsed + comm_delay + fire_delay ≈ 65 ms</text>
<path d="M60,344 L60,350 L1020,350 L1020,344" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
<text x="64.0" y="366.0" font-size="11.5" fill="#a78bfa" text-anchor="start" font-weight="normal">瞄准时刻 T = t_exp + L + t_fly（总提前量 ≈ 190–365 ms，随距离变）</text>
<text x="24.0" y="406.0" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="bold">② 每帧计算流程</text>
<rect x="24" y="420" width="176" height="168" rx="8" fill="#16213a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="112.0" y="444.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="bold">1 打戳与姿态</text>
<text x="34.0" y="470.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">曝光中心戳 t_exp</text>
<text x="34.0" y="492.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">PoseBuffer 在 t_exp</text>
<text x="34.0" y="514.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">SLERP 插值云台姿态</text>
<text x="34.0" y="536.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">→ 世界系（重力对齐）</text>
<text x="34.0" y="558.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">无姿态样本 → 丢帧</text>
<line x1="201.0" y1="504.0" x2="213.0" y2="504.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="214" y="420" width="176" height="168" rx="8" fill="#16213a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="302.0" y="444.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">2 检测 + PnP</text>
<text x="224.0" y="470.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">灯条 → 装甲板四角点</text>
<text x="224.0" y="492.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">IPPE 双解 + yaw 搜索</text>
<text x="224.0" y="514.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">板位置 p、朝向 yaw</text>
<text x="224.0" y="536.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">距离 d = |p|</text>
<text x="224.0" y="558.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">（距离也下发 MCU）</text>
<line x1="391.0" y1="504.0" x2="403.0" y2="504.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="404" y="420" width="176" height="168" rx="8" fill="#16213a" stroke="#14b8a6" stroke-width="1.5"/>
<text x="492.0" y="444.0" font-size="13" fill="#14b8a6" text-anchor="middle" font-weight="bold">3 整车 EKF</text>
<text x="414.0" y="470.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">状态：中心 x,y,z 与速度</text>
<text x="414.0" y="492.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">yaw、ω、r1、r2、dz</text>
<text x="414.0" y="514.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">在 t_exp 融合观测</text>
<text x="414.0" y="536.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">predict(t)：Singer 阻尼</text>
<text x="414.0" y="558.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">速度 + 匀角速转动</text>
<line x1="581.0" y1="504.0" x2="593.0" y2="504.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="594" y="420" width="176" height="168" rx="8" fill="#16213a" stroke="#14b8a6" stroke-width="1.5"/>
<text x="682.0" y="444.0" font-size="13" fill="#14b8a6" text-anchor="middle" font-weight="bold">4 飞行时间迭代</text>
<text x="604.0" y="470.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">t_fly ← 初值</text>
<text x="604.0" y="492.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">x̂ = predict(t_exp+L+t_fly)</text>
<text x="604.0" y="514.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">选板 k → 瞄准点 P</text>
<text x="604.0" y="536.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">solve(P) → pitch, t_fly′</text>
<text x="604.0" y="558.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">|Δt| &lt; 0.1 ms 或 6 次</text>
<line x1="771.0" y1="504.0" x2="783.0" y2="504.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="784" y="420" width="176" height="168" rx="8" fill="#16213a" stroke="#ef4444" stroke-width="1.5"/>
<text x="872.0" y="444.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="bold">5 开火判定</text>
<text x="794.0" y="470.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">TRACKING 且已收敛</text>
<text x="794.0" y="492.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">|朝向角| &lt; 30°</text>
<text x="794.0" y="514.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">σ 门控（可选，哨兵关）</text>
<text x="794.0" y="536.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">云台在板角宽内</text>
<text x="794.0" y="558.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">|ω| &gt; 12 → 中心模式</text>
<line x1="961.0" y1="504.0" x2="973.0" y2="504.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="974" y="420" width="176" height="168" rx="8" fill="#16213a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="1062.0" y="444.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="bold">6 串口下发</text>
<text x="984.0" y="470.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">yaw, pitch (+补偿)</text>
<text x="984.0" y="492.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">yaw_vel 前馈</text>
<text x="984.0" y="514.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">distance_mm</text>
<text x="984.0" y="536.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">found, fire</text>
<text x="984.0" y="558.0" font-size="11.2" fill="#e2e8f0" text-anchor="start" font-weight="normal">21 B 帧 → MCU</text>
<path d="M756,580 C776,618 588,618 608,580" fill="none" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#at)"/>
<text x="682.0" y="622.0" font-size="10.5" fill="#14b8a6" text-anchor="middle" font-weight="normal">t_fly 依赖 P 的距离，P 又依赖 t_fly：不动点迭代</text>
<text x="24.0" y="646.0" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="bold">③ 综合预测：瞄准的是“子弹到达时”装甲板的位置</text>
<rect x="24" y="660" width="560" height="210" rx="8" fill="#16213a" stroke="#334155" stroke-width="1.5"/>
<circle cx="120" cy="765" r="50" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
<line x1="68.1" y1="763.6" x2="76.4" y2="736.8" stroke="#94a3b8" stroke-width="4"/>
<line x1="121.4" y1="713.1" x2="148.2" y2="721.4" stroke="#94a3b8" stroke-width="4"/>
<line x1="171.9" y1="766.4" x2="163.6" y2="793.2" stroke="#94a3b8" stroke-width="4"/>
<line x1="118.6" y1="816.9" x2="91.8" y2="808.6" stroke="#94a3b8" stroke-width="4"/>
<circle cx="120" cy="765" r="3" fill="#94a3b8"/>
<text x="120.0" y="837.0" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal">t_exp 时</text>
<circle cx="235" cy="755" r="50" fill="none" stroke="#14b8a6" stroke-dasharray="4 3"/>
<line x1="205.9" y1="712.0" x2="232.5" y2="703.1" stroke="#14b8a6" stroke-width="4"/>
<line x1="278.0" y1="725.9" x2="286.9" y2="752.5" stroke="#14b8a6" stroke-width="4"/>
<line x1="264.1" y1="798.0" x2="237.5" y2="806.9" stroke="#14b8a6" stroke-width="4"/>
<line x1="192.0" y1="784.1" x2="183.1" y2="757.5" stroke="#14b8a6" stroke-width="4"/>
<circle cx="235" cy="755" r="3" fill="#14b8a6"/>
<text x="235.0" y="827.0" font-size="11" fill="#14b8a6" text-anchor="middle" font-weight="normal">T 时（预测）</text>
<line x1="124.0" y1="763.0" x2="229.0" y2="754.0" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#at)"/>
<text x="177.5" y="753.0" font-size="11" fill="#14b8a6" text-anchor="middle" font-weight="normal">v·Δt</text>
<circle cx="250.8" cy="802.4" r="8" fill="none" stroke="#ef4444" stroke-width="2"/>
<text x="262.8" y="806.4" font-size="11" fill="#ef4444" text-anchor="start" font-weight="normal">P：被选中的板</text>
<circle cx="44" cy="850" r="5" fill="#e2e8f0"/>
<text x="54.0" y="854.0" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="normal">枪口</text>
<line x1="44" y1="850" x2="250.8" y2="802.4" stroke="#ef4444" stroke-dasharray="5 4"/>
<text x="318.0" y="696.0" font-size="10.8" fill="#e2e8f0" text-anchor="start" font-weight="normal">中心 c(T) = c + v·τ(1 − e^(−Δt/τ))</text>
<text x="318.0" y="718.0" font-size="10.8" fill="#e2e8f0" text-anchor="start" font-weight="normal">（Singer 速度阻尼，τ = 0.3 s）</text>
<text x="318.0" y="740.0" font-size="10.8" fill="#e2e8f0" text-anchor="start" font-weight="normal">第 k 块板角度 θk = yaw + ω·Δt + k·π/2</text>
<text x="318.0" y="762.0" font-size="10.8" fill="#e2e8f0" text-anchor="start" font-weight="normal">板位置 Pk = c(T) − r_k·(cos θk, sin θk) + dz_k</text>
<text x="318.0" y="784.0" font-size="10.8" fill="#e2e8f0" text-anchor="start" font-weight="normal">Δt = T − t_exp = L + t_fly</text>
<rect x="600" y="660" width="556" height="210" rx="8" fill="#16213a" stroke="#334155" stroke-width="1.5"/>
<text x="616.0" y="688.0" font-size="11.5" fill="#e2e8f0" text-anchor="start" font-weight="bold">为什么每一段都要算进去</text>
<text x="616.0" y="711.0" font-size="10.8" fill="#94a3b8" text-anchor="start" font-weight="normal">10 rad/s 小陀螺：Δt 每错 10 ms，板的相位错 5.7°（半径 0.25 m 处约 2.5 cm）</text>
<text x="616.0" y="734.0" font-size="10.8" fill="#f59e0b" text-anchor="start" font-weight="normal">仿真 165 Hz：漏算 30 ms 发射延迟 → 10 rad/s 命中率 98.9% → 65.3%</text>
<text x="616.0" y="757.0" font-size="10.8" fill="#94a3b8" text-anchor="start" font-weight="normal">串口+MCU 抖动 ±10 ms → 8 场景平均只掉约 0.5 pp</text>
<text x="616.0" y="780.0" font-size="10.8" fill="#e2e8f0" text-anchor="start" font-weight="normal">估短比估长代价大：拿不准时宁可让模型略长</text>
<text x="616.0" y="803.0" font-size="10.8" fill="#ef4444" text-anchor="start" font-weight="normal">云台滞后补偿 gimbal_lag：仿真 +1 pp，真实视频退化 → 默认 0</text>
<text x="616.0" y="826.0" font-size="10.8" fill="#14b8a6" text-anchor="start" font-weight="normal">帧率无关：门限按时间（tracking 80 ms、丢帧宽限 20 ms）</text>
<text x="616.0" y="849.0" font-size="10.8" fill="#94a3b8" text-anchor="start" font-weight="normal">数据：docs/studies/latency_chain_165hz.md</text>
</svg>
