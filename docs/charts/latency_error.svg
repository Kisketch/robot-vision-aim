<text x="24" y="50" font-size="11.5" fill="#94a3b8">横轴：真实出膛时刻 − 模型时刻；实线 = 10 rad/s 快速小陀螺，虚线 = 8 场景平均；橙 = 无抖动，蓝 = ±10 ms 抖动</text>
<line x1="70" y1="310" x2="860" y2="310" stroke="#1e293b"/>
