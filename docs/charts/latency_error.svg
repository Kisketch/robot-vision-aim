<text x="662" y="84" font-size="11" fill="#e2e8f0">真实链路比模型长 → 打在板后</text>
<text x="80" y="300" font-size="11" fill="#94a3b8">左侧（比模型短）偏高来自仿真云台的 30 ms 一阶滞后；按此加补偿在真实视频上反而退化，未采用</text>
